services:
  backend:
    : .
    ports:
      - "8000:8000"
    volumes:
      - .:/backend/app
    depends_on:
      - db

  db:
    image: postgres:16
    environment:   
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 124578
      POSTGRES_DB: blogdb
    ports:
      - "5433:5432"
    volumes:
      - postgre_data:/var/lib/postgresql/data
  
volumes:
  postgre_data: